<script>
let DATA = {"schemes": ["func", "impact", "impact-band-N", "impact-band-A", "risk", "mystic_state", "operation", "exposition", "phase", "relation"], "concepts": [{"id": "legittimazione", "scheme": "func", "broader": null, "top": true, "notation": "#legittimazione", "pref": "legittimazione", "definition": "Procedure retoriche che consolidano l’ortodossia del discorso mistico mediante appoggi biblici, liturgici e tradizionali (anche aurorali), usati per evitare sospetti di quietismo e per ancorare temi rischiosi all’autorità della Chiesa, dei santi."}, {"id": "legittimazione-biblica", "scheme": "func", "broader": "legittimazione", "top": false, "notation": "#legittimazione-biblica", "pref": "legittimazione biblica", "definition": "Citazioni e parafrasi scritturali, spesso in latino, impiegate per rendere accettabili concetti come \"quiete\", \"infusione\" e \"unione\", mostrando conformità alla dottrina e inserendo l’esperienza mistica in una cornice canonica."}, {"id": "legittimazione-liturgica", "scheme": "func", "broader": "legittimazione", "top": false, "notation": "#legittimazione-liturgica", "pref": "legittimazione liturgica", "definition": "Ricorso a formule, stilemi e registri liturgici come garanzia devozionale e dottrinale, utile a circoscrivere affermazioni speculative e a integrare il trattato nella tradizione della preghiera ecclesiale."}, {"id": "legittimazione-tradizione", "scheme": "func", "broader": "legittimazione", "top": false, "notation": "#legittimazione-tradizione", "pref": "legittimazione tradizione", "definition": "Appello a maestri della mistica esplicitamente richiamati in prima persona dall’autrice (\"la mia santa madre Teresa\" per Teresa d’Avila; \"il mio padre beato Giovanni della Croce\") come legittimazione autorevole, a creare continuità con la genealogia carmelitana e a rafforzare la credibilità di un’autrice priva di formazione scolastica."}, {"id": "pedagogia", "scheme": "func", "broader": null, "top": true, "notation": "#pedagogia", "pref": "pedagogia", "definition": "Strategie formative rivolte ad anime \"incipienti\", \"proficienti\" e \"perfette\", basate su distinzioni operative, esemplificazioni concrete e introduzione graduale ai concetti mistici, al fine di guidare il lettore nel discernimento e prevenire errori dottrinali."}, {"id": "pedagogia-introduzione", "scheme": "func", "broader": "pedagogia", "top": false, "notation": "#pedagogia-introduzione", "pref": "pedagogia introduzione", "definition": "Sezioni introduttive e inquadramenti che predispongono il lettore all’orazione mentale e alla costruzione del “castello”, facendo leva sull’obbedienza e sulla dichiarata umiltà dell’autrice."}, {"id": "pedagogia-discernimento", "scheme": "func", "broader": "pedagogia", "top": false, "notation": "#pedagogia-discernimento", "pref": "pedagogia discernimento", "definition": "Distinzioni tra (1) \"meditazione\", (2) \"contemplazione acquisita\", (3) \"contemplazione infusa\", (4) \"quiete\" e (5) \"sospensione delle potenze\", con cui l’autrice chiarisce la progressione mistica e aiuta il lettore-ascoltatore a riconoscere illusioni o inganni spirituali."}, {"id": "pedagogia-esemplificazione", "scheme": "func", "broader": "pedagogia", "top": false, "notation": "#pedagogia-esemplificazione", "pref": "pedagogia esemplificazione", "definition": "Uso di immagini quotidiane (acqua, mare, torrente, giardino, specchio) e comparazioni che rendono intelligibili realtà sovrasensibili, traducendo la teologia mistica in scenari comprensibili anche a un pubblico poco istruito."}, {"id": "rischio", "scheme": "func", "broader": null, "top": true, "notation": "#rischio", "pref": "rischio", "definition": "Insieme di strategie volte a prevenire o correggere letture potenzialmente eterodosse, specialmente nei punti critici (ex: Libro III), dove emergono concetti come \"impeccabilità\", \"fusione con Dio\", \"notte oscura\" e perdita apparente del \"libero arbitrio\"."}, {"id": "rischio-attenuatio", "scheme": "func", "broader": "rischio", "top": false, "notation": "#rischio-attenuatio", "pref": "rischio attenuatio", "definition": "Glosse esplicative aggiunte per smorzare formulazioni rischiose, spesso tramite “cioè”, “intendo dire”, “mi dichiaro”, con cui l’autrice riduce ambiguità dottrinali."}, {"id": "rischio-precisatio", "scheme": "func", "broader": "rischio", "top": false, "notation": "#rischio-precisatio", "pref": "rischio precisatio", "definition": "Limitazioni semantiche che delimitano concetti radicali (come “divenir un altro Dio”, “sicurtà totale”), precisando che il libero arbitrio non viene mai abolito e che l’azione resta sempre divina."}, {"id": "rischio-declaratio", "scheme": "func", "broader": "rischio", "top": false, "notation": "#rischio-declaratio", "pref": "rischio declaratio", "definition": "Dichiarazioni esplicite di adesione alla Chiesa e di rifiuto della “molinia” (Molinos), formulate per disinnescare ogni sospetto di quietismo e per riconfigurare enunciati pericolosi in senso ortodosso."}, {"id": "ethos", "scheme": "func", "broader": null, "top": true, "notation": "#ethos", "pref": "ethos", "definition": "Costruzione dell’immagine autoriale come donna ignorante, obbediente e priva di lettere, che scrive per comando del confessore; strategia di protezione che al contempo rivendica l’esperienza diretta come fonte primaria di sapere mistico."}, {"id": "ethos-umilta", "scheme": "func", "broader": "ethos", "top": false, "notation": "#ethos-umilta", "pref": "ethos umilta", "definition": "Professioni di \"indegnità\" e \"ignoranza\" per minimizzare la propria autorità; l’autrice usa queste formule per giustificare la scrittura teologica da parte di una donna."}, {"id": "ethos-esperienza", "scheme": "func", "broader": "ethos", "top": false, "notation": "#ethos-esperienza", "pref": "ethos esperienza", "definition": "Rivendicazione dell’esperienza (“non parlo senza l’esperienza”) come fondamento epistemico che legittima il discorso spirituale in mancanza di titoli di studio o di formazione teologica."}, {"id": "ethos-obbedienza", "scheme": "func", "broader": "ethos", "top": false, "notation": "#ethos-obbedienza", "pref": "ethos obbedienza", "definition": "Insistenza sull’obbedienza al confessore (a scopo difensivo), vista come condizione necessaria per scrivere e come garanzia di umiltà, prudenza e sottomissione dottrinale."}, {"id": "impact-high", "scheme": "impact", "broader": null, "top": true, "notation": "#impact-high", "pref": "impact high", "definition": "Fascia alta dell'indice (0.66 ≤ I < 0.82): forte forza regolativa del marcatore. Passaggi che ridefiniscono proposizioni dottrinali centrali (contemplazione infusa, unione, quiete, notte dei sensi), decisivi per la comprensione dell'opera e frequente oggetto di glosse prudenziali."}, {"id": "impact-medium", "scheme": "impact", "broader": null, "top": true, "notation": "#impact-medium", "pref": "impact medium", "definition": "Fascia intermedia dell'indice (0.50 ≤ I < 0.66): forza regolativa moderata. Marcatori che rafforzano o integrano i concetti principali (esempi, distinzioni, spiegazioni accessorie) senza modificarne l'assetto teologico."}, {"id": "impact-low", "scheme": "impact", "broader": null, "top": true, "notation": "#impact-low", "pref": "impact low", "definition": "Fascia inferiore dell'indice (I < 0.50): minima forza regolativa del marcatore. Parti ornamentali o reiterative, utili all'enfasi ma non decisive per l'argomentazione teologica."}, {"id": "impact-critical", "scheme": "impact", "broader": null, "top": true, "notation": "#impact-critical", "pref": "impact critical", "definition": "Fascia superiore dell'indice (I ≥ 0.82): massima forza regolativa del marcatore. Nel campione coincide con le declaratio (F=3), i sigilli performativi di ortodossia (\"io mi dichiaro\"), collocati nei nodi dottrinalmente più esposti (trasformazione, apparente \"impeccabilità\", \"sicurtà divina\", \"sospensione delle potenze\")."}, {"id": "impact-band-N-critica", "scheme": "impact-band-N", "broader": null, "top": true, "notation": "critica", "pref": "impact band N critica", "definition": "Banda «critica» di necessità interpretativa (N ≥ 0.85); valore-ancora N = 0.90. La rimozione del presidio esporrebbe il passo a eresia esplicita (panteismo o quietismo)."}, {"id": "impact-band-N-alta", "scheme": "impact-band-N", "broader": null, "top": true, "notation": "alta", "pref": "impact band N alta", "definition": "Banda «alta» (0.65 ≤ N < 0.85); valore-ancora N = 0.75. Passo teologicamente sensibile: la glossa è strutturalmente utile, ma il nodo non collassa in eresia esplicita."}, {"id": "impact-band-N-media", "scheme": "impact-band-N", "broader": null, "top": true, "notation": "media", "pref": "impact band N media", "definition": "Banda «media» (0.45 ≤ N < 0.65); valore-ancora N = 0.55. Chiarificazione utile, esposizione moderata; l'assenza non produrrebbe deriva dottrinale."}, {"id": "impact-band-N-bassa", "scheme": "impact-band-N", "broader": null, "top": true, "notation": "bassa", "pref": "impact band N bassa", "definition": "Banda «bassa» (N < 0.45); valore-ancora N = 0.30. Funzione marginale, ornamentale o descrittiva."}, {"id": "impact-band-A-alta", "scheme": "impact-band-A", "broader": null, "top": true, "notation": "alta", "pref": "impact band A alta", "definition": "Banda «alta» di riduzione dell'ambiguità (A ≥ 0.80); valore-ancora A = 0.85. Chiude quasi del tutto l'ambiguità e delimita con precisione."}, {"id": "impact-band-A-media", "scheme": "impact-band-A", "broader": null, "top": true, "notation": "media", "pref": "impact band A media", "definition": "Banda «media» (0.55 ≤ A < 0.80); valore-ancora A = 0.675. Restringe il campo ma lascia un margine di lettura."}, {"id": "impact-band-A-bassa", "scheme": "impact-band-A", "broader": null, "top": true, "notation": "bassa", "pref": "impact band A bassa", "definition": "Banda «bassa» (A < 0.55); valore-ancora A = 0.40. Tocca l'ambiguità solo marginalmente."}, {"id": "risk-dottrinale", "scheme": "risk", "broader": null, "top": true, "notation": "#risk-dottrinale", "pref": "risk dottrinale", "definition": "Rischio generale di equivocità su dottrine come \"grazia\", \"libertà\", \"unione\" e \"contemplazione\", soprattutto nei punti dove la lingua dell’autrice risulta ambigua o metaforicamente esasperata. Categoria contenitore: se usata direttamente in @ana, senza una delle foglie (quietismo, panteismo, impeccabilità, ambiguità), denota, per astensione semantica (guida, regola 3), un rischio dottrinale di sottotipo non specificato."}, {"id": "risk-quietismo", "scheme": "risk", "broader": "risk-dottrinale", "top": false, "notation": "#risk-quietismo", "pref": "risk quietismo", "definition": "Possibile lettura quietista dei concetti di “quiete”, “otio”, “non operare”, “abbandono totale”; rischio amplificato dal contesto storico e dalle accuse processuali."}, {"id": "risk-panteismo", "scheme": "risk", "broader": "risk-dottrinale", "top": false, "notation": "#risk-panteismo", "pref": "risk panteismo", "definition": "Rischio di interpretazione panteistica nelle espressioni sulla “trasformatione” e sul “divenir un altro Dio”; necessità di glosse per riaffermare la distinzione ontologica creatura/Creatore."}, {"id": "risk-impeccabilita", "scheme": "risk", "broader": "risk-dottrinale", "top": false, "notation": "#risk-impeccabilita", "pref": "risk impeccabilita", "definition": "Ambiguità relative alla “sicurtà” mistica e alla percezione dell’impossibilità di peccare nello stato di unione (impeccabilità); richiede continui interventi mitiganti."}, {"id": "risk-ambiguita", "scheme": "risk", "broader": "risk-dottrinale", "top": false, "notation": "#risk-ambiguita", "pref": "risk ambiguita", "definition": "Punti in cui la formulazione è oscura, metaforica o oscillante, generando difficoltà interpretative non collocabili in categorie specifiche."}, {"id": "mystic_state-purificazione", "scheme": "mystic_state", "broader": null, "top": true, "notation": "#mystic_state-purificazione", "pref": "mystic state purificazione", "definition": "Fase purgativa del cammino mistico: prove, tribolazioni, sofferenze che preparano l’anima alla contemplazione, spesso associate alla croce."}, {"id": "mystic_state-illuminazione", "scheme": "mystic_state", "broader": null, "top": true, "notation": "#mystic_state-illuminazione", "pref": "mystic state illuminazione", "definition": "Fase illuminativa: elevazione, dolcezza, chiarezza contemplativa che precede l’unione piena."}, {"id": "mystic_state-quiete", "scheme": "mystic_state", "broader": null, "top": true, "notation": "#mystic_state-quiete", "pref": "mystic state quiete", "definition": "Stato di sospensione delle potenze, spesso minacciato da interpretazioni quietistiche; descritto come pace interiore infusa da Dio."}, {"id": "mystic_state-otium", "scheme": "mystic_state", "broader": null, "top": true, "notation": "#mystic_state-otium", "pref": "mystic state otium", "definition": "Ozio delle potenze inteso non come inerzia quietista, ma come sospensione operata da Dio affinché l’anima riceva passivamente la contemplazione infusa."}, {"id": "mystic_state-unione", "scheme": "mystic_state", "broader": null, "top": true, "notation": "#mystic_state-unione", "pref": "mystic state unione", "definition": "Stato mistico di massimo avvicinamento a Dio, descritto con lessico alto e analogie complesse; luogo delle maggiori ambiguità teologiche."}, {"id": "operation-delimitazione", "scheme": "operation", "broader": null, "top": true, "notation": "#operation-delimitazione", "pref": "operation delimitazione", "definition": "Operazioni che circoscrivono semanticamente concetti rischiosi, evitando letture estreme e guidando l’interpretazione entro limiti ortodossi."}, {"id": "operation-attenuatio", "scheme": "operation", "broader": null, "top": true, "notation": "#operation-attenuatio", "pref": "operation attenuatio", "definition": "Interventi che smorzano formulazioni troppo ardite mediante spiegazioni aggiunte, spesso negli spazi marginali del manoscritto."}, {"id": "operation-precisatio", "scheme": "operation", "broader": null, "top": true, "notation": "#operation-precisatio", "pref": "operation precisatio", "definition": "Chiarimenti puntuali volti a definire meglio concetti ambigui, tipici della riflessione autografa posteriore alla stesura iniziale."}, {"id": "operation-declaratio", "scheme": "operation", "broader": null, "top": true, "notation": "#operation-declaratio", "pref": "operation declaratio", "definition": "Dichiarazioni dirette di ortodossia, con cui l’autrice esplicita la propria adesione alla dottrina per evitare interpretazioni sospette."}, {"id": "operation-riequilibrio", "scheme": "operation", "broader": null, "top": true, "notation": "#operation-riequilibrio", "pref": "operation riequilibrio", "definition": "Interventi equilibranti che compensano un’affermazione rischiosa con una precisazione ortodossa prima o dopo l’enunciato mistico."}, {"id": "exposition-low", "scheme": "exposition", "broader": null, "top": true, "notation": "#exposition-low", "pref": "exposition low", "definition": "Esposizione prudente di temi dottrinali, con ricorso limitato a tecnicismi e metafore."}, {"id": "exposition-medium", "scheme": "exposition", "broader": null, "top": true, "notation": "#exposition-medium", "pref": "exposition medium", "definition": "Esposizione moderata di contenuti mistici, con appoggi occasionali a citazioni e spiegazioni aggiuntive."}, {"id": "exposition-high", "scheme": "exposition", "broader": null, "top": true, "notation": "#exposition-high", "pref": "exposition high", "definition": "Esposizione intensa di dottrine mistiche complesse che richiedono glosse, precisazioni e cautele retoriche."}, {"id": "exposition-critical", "scheme": "exposition", "broader": null, "top": true, "notation": "#exposition-critical", "pref": "exposition critical", "definition": "Livello massimo di esposizione dottrinale, tipico delle sezioni sul matrimonio spirituale, la trasformazione e l’unione; punti fortemente a rischio di censura."}, {"id": "phase-introduction", "scheme": "phase", "broader": null, "top": true, "notation": "#phase-introduction", "pref": "phase introduction", "definition": "Segmenti introduttivi che stabiliscono tono, pubblico e obbedienza iniziale, preparando la progressione mistica."}, {"id": "phase-mediana", "scheme": "phase", "broader": null, "top": true, "notation": "#phase-mediana", "pref": "phase mediana", "definition": "Sezioni centrali in cui si analizzano stati intermedi del cammino contemplativo, con esempi ed esperienze."}, {"id": "phase-conclusive", "scheme": "phase", "broader": null, "top": true, "notation": "#phase-conclusive", "pref": "phase conclusive", "definition": "Chiusure che ricapitolano i contenuti, riordinano la materia e predispongono alla transizione verso stati più elevati."}, {"id": "phase-critical", "scheme": "phase", "broader": null, "top": true, "notation": "#phase-critical", "pref": "phase critical", "definition": "Marcatore trasversale, non posizionale: segnala che il segmento è teologicamente delicato indipendentemente da dove si colloca nella sequenza. Va assegnato insieme a una delle tre fasi posizionali sopra (introduction/mediana/conclusive), non al loro posto, per permettere l’allineamento tra collocazione testuale, rischio (risk) ed esposizione (exposition) sulla stessa occorrenza."}, {"id": "relation-mistica", "scheme": "relation", "broader": null, "top": true, "notation": "#relation-mistica", "pref": "relation mistica", "definition": "Relazioni che descrivono la progressione fenomenologica tra stati mistici lungo il cammino contemplativo, comprensiva delle immagini esperienziali (luce, tenebra, sonno, quiete) con cui l’autrice le descrive."}, {"id": "relation-mistica-infusa-purificazione", "scheme": "relation", "broader": "relation-mistica", "top": false, "notation": "#relation-mistica-infusa-purificazione", "pref": "relation mistica infusa purificazione", "definition": "Relazione concettuale che descrive il passaggio dalle prove purgative alla contemplazione infusa."}, {"id": "relation-mistica-attiva-meditazione", "scheme": "relation", "broader": "relation-mistica", "top": false, "notation": "#relation-mistica-attiva-meditazione", "pref": "relation mistica attiva meditazione", "definition": "Relazione progressiva dalla meditazione attiva alla maturazione spirituale che prepara alla contemplazione."}, {"id": "relation-mistica-passiva-quiete", "scheme": "relation", "broader": "relation-mistica", "top": false, "notation": "#relation-mistica-passiva-quiete", "pref": "relation mistica passiva quiete", "definition": "Relazione tra contemplazione passiva e quiete, descritta come sospensione delle potenze per opera di Dio."}, {"id": "relation-mistica-unione-sposalitio", "scheme": "relation", "broader": "relation-mistica", "top": false, "notation": "#relation-mistica-unione-sposalitio", "pref": "relation mistica unione sposalitio", "definition": "Sequenza che conduce dall’unione allo sposalizio spirituale e alla trasformazione, secondo i modelli mistici tradizionali."}, {"id": "relation-intertesto", "scheme": "relation", "broader": null, "top": true, "notation": "#relation-intertesto", "pref": "relation intertesto", "definition": "Relazioni con fonti esterne al testo, di diversa natura e provenienza."}, {"id": "relation-intertesto-biblico", "scheme": "relation", "broader": "relation-intertesto", "top": false, "notation": "#relation-intertesto-biblico", "pref": "relation intertesto biblico", "definition": "Richiami espliciti o impliciti alla Scrittura che sostengono la dottrina mistica."}, {"id": "relation-intertesto-liturgico", "scheme": "relation", "broader": "relation-intertesto", "top": false, "notation": "#relation-intertesto-liturgico", "pref": "relation intertesto liturgico", "definition": "Riferimenti a testi, formule o registri liturgici che rinforzano il tono devoto e la legittimità dell’opera."}, {"id": "relation-intertesto-teresiano", "scheme": "relation", "broader": "relation-intertesto", "top": false, "notation": "#relation-intertesto-teresiano", "pref": "relation intertesto teresiano", "definition": "Risonanze e riprese del linguaggio e dei temi di Teresa d’Avila e delle tradizioni carmelitane."}, {"id": "relation-intertesto-molinista", "scheme": "relation", "broader": "relation-intertesto", "top": false, "notation": "#relation-intertesto-molinista", "pref": "relation intertesto molinista", "definition": "Affinità o divergenze rispetto al linguaggio della Guida di Molinos, spesso tematizzate per prendere le distanze dal quietismo."}], "base": "https://w3id.org/castello-anima-vocab/"};

  d.schemes.forEach(sch=>{
    const cons=d.concepts.filter(c=>c.scheme===sch);
    const roots=cons.filter(c=>!c.broader), kids=c=>cons.filter(x=>x.broader===c.id);
    const match=c=>!q||[c.pref,c.notation,c.definition,c.id].some(v=>(v||"").toLowerCase().includes(q));
    const visible=cons.filter(match);
    if(!visible.length) return;
    const sec=document.createElement("section"); sec.className="scheme";
    sec.innerHTML=`<h2>Asse: ${esc(sch)}</h2><div class="sch-uri">${esc(d.base)}${esc(sch)}</div>`;
    const card=c=>{
      shown++;
      return `<div class="c ${c.broader?'child':''}">
        <div class="top"><span class="pref">${esc(c.pref)}</span>
          <span class="notn">${esc(c.notation)}</span>
          ${c.top?'<span class="rel">▲ top concept</span>':(c.broader?`<span class="rel">↳ ${esc(c.broader)}</span>`:'')}</div>
        <div class="def">${esc(c.definition)}</div>
        <div class="uri">${esc(d.base)}${esc(c.id)}</div></div>`;
    };
    roots.forEach(r=>{ if(match(r)) sec.innerHTML+=card(r);
      kids(r).forEach(k=>{ if(match(k)) sec.innerHTML+=card(k); }); });
    // concetti che matchano ma la cui radice no
    cons.filter(c=>c.broader&&match(c)&&!match(cons.find(x=>x.id===c.broader)||{})).forEach(()=>{});
    out.appendChild(sec);
  });
  document.getElementById("cnt").textContent=shown+" concetti"+(q?" (filtro attivo)":"");
}
document.getElementById("q").addEventListener("input",e=>render(DATA,e.target.value));
document.getElementById("file").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{DATA=parseTTL(r.result);document.getElementById("q").value="";render(DATA,"");};
  r.readAsText(f);
});
render(DATA,"");
</script></body></html>
