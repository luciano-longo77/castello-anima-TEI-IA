name: Validate Taxonomy

on:
  push:
    branches: [main]
    paths:
      - "tei/taxonomy/**"
      - "tei/header/**"
  pull_request:
    branches: [main]
    paths:
      - "tei/taxonomy/**"
      - "tei/header/**"
  workflow_dispatch:

jobs:
  validate:
    name: Validate tassonomia-gh.xml (RelaxNG + Schematron + esempi)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install lxml
        run: pip install lxml

      - name: Check required files exist
        run: |
          test -f tei/taxonomy/tassonomia-gh.xml || { echo "::error::tei/taxonomy/tassonomia-gh.xml non trovato"; exit 1; }
          test -f tei/taxonomy/schema/taxonomy-rng.rng || { echo "::error::tei/taxonomy/schema/taxonomy-rng.rng non trovato"; exit 1; }
          test -f tei/taxonomy/schema/taxonomy-sch.sch || { echo "::error::tei/taxonomy/schema/taxonomy-sch.sch non trovato"; exit 1; }
          echo "Tutti i file richiesti sono presenti."

      - name: Run validation (well-formed, RelaxNG, Schematron, core taxonomies, @ana referenziale negli esempi)
        run: |
          cat > validate_taxonomy.py << 'PYEOF'
          import sys
          import glob
          from lxml import etree, isoschematron

          XML_PATH = "tei/taxonomy/tassonomia-gh.xml"
          RNG_PATH = "tei/taxonomy/schema/taxonomy-rng.rng"
          SCH_PATH = "tei/taxonomy/schema/taxonomy-sch.sch"
          ESEMPIO_GLOB = "tei/taxonomy/esempio/*.xml"

          REQUIRED_TAXONOMIES = [
              "func", "risk", "impact", "mystic_state",
              "operation", "exposition", "phase", "relation",
          ]

          ns = {"tei": "http://www.tei-c.org/ns/1.0", "xml": "http://www.w3.org/XML/1998/namespace"}

          errors = []

          # 1. Ben formato
          try:
              doc = etree.parse(XML_PATH)
          except etree.XMLSyntaxError as e:
              print(f"::error::{XML_PATH} non e' ben formato: {e}")
              sys.exit(1)

          # 2. RelaxNG
          try:
              rng = etree.RelaxNG(etree.parse(RNG_PATH))
              if not rng.validate(doc):
                  for log_entry in rng.error_log:
                      errors.append(f"RelaxNG: {log_entry}")
          except Exception as e:
              print(f"::error::Errore caricando lo schema RelaxNG: {e}")
              sys.exit(1)

          # 3. Schematron
          try:
              sch = isoschematron.Schematron(etree.parse(SCH_PATH), store_report=True)
              if not sch.validate(doc):
                  svrl_ns = {"svrl": "http://purl.oclc.org/dsdl/svrl"}
                  for fail in sch.validation_report.xpath("//svrl:failed-assert", namespaces=svrl_ns):
                      loc = fail.get("location", "?")
                      text = (fail.findtext("svrl:text", namespaces=svrl_ns) or "").strip()
                      errors.append(f"Schematron [{loc}]: {text}")
          except Exception as e:
              print(f"::error::Errore caricando lo schema Schematron: {e}")
              sys.exit(1)

          # 4. Presenza delle 8 tassonomie core (radici di classDecl)
          valid_ids = set(
              doc.xpath("//tei:classDecl//tei:category/@xml:id | //tei:classDecl//tei:taxonomy/@xml:id", namespaces=ns)
          )
          taxonomy_root_ids = set(
              doc.xpath("//tei:classDecl/tei:taxonomy/@xml:id", namespaces=ns)
          )
          missing = [t for t in REQUIRED_TAXONOMIES if t not in taxonomy_root_ids]
          if missing:
              errors.append(f"Tassonomie core mancanti: {', '.join(missing)}")

          # 5. Riferimenti @ana nei file esempio: ogni token deve puntare a un xml:id reale
          esempio_files = glob.glob(ESEMPIO_GLOB)
          for esempio_path in esempio_files:
              try:
                  esempio_doc = etree.parse(esempio_path)
              except etree.XMLSyntaxError as e:
                  errors.append(f"{esempio_path}: non e' ben formato: {e}")
                  continue
              for el in esempio_doc.iter():
                  ana = el.get("ana")
                  if not ana:
                      continue
                  el_id = el.get("{http://www.w3.org/XML/1998/namespace}id", "?")
                  for token in ana.split():
                      bare = token.lstrip("#")
                      if bare not in valid_ids:
                          errors.append(
                              f"{esempio_path} (xml:id={el_id}): @ana='{token}' non corrisponde "
                              f"a nessuna categoria dichiarata in {XML_PATH}"
                          )

          # Esito
          if errors:
              print("::error::Validazione fallita:")
              for err in errors:
                  print(f"  - {err}")
              sys.exit(1)

          print(f"Validazione superata: ben formato, RelaxNG OK, Schematron OK, tassonomie core presenti, "
                f"{len(esempio_files)} file esempio verificati (@ana referenziale OK).")
          PYEOF
          python validate_taxonomy.py
      - name: Validazione strutturale degli esempi (RNG TEI All)
        run: |
          test -s schema/tei_all.rng || { echo "::error::schema/tei_all.rng mancante o vuoto"; exit 1; }
          cat > validate_esempi.py << 'PYEOF'
          import sys, glob
          from lxml import etree
          rng = etree.RelaxNG(etree.parse("schema/tei_all.rng"))
          errors, files = [], sorted(glob.glob("tei/taxonomy/esempio/*.xml"))
          for f in files:
              try:
                  doc = etree.parse(f)
              except etree.XMLSyntaxError as e:
                  errors.append(f"{f}: non ben formato: {e}"); continue
              if not rng.validate(doc):
                  for log in rng.error_log:
                      errors.append(f"{f}: {log}")
          if not files:
              print("::warning::nessun esempio in tei/taxonomy/esempio/*.xml")
          if errors:
              print("::error::Validazione strutturale esempi fallita:")
              for e in errors: print("  -", e)
              sys.exit(1)
          print(f"Validazione strutturale OK: {len(files)} esempio/i validi contro tei_all.rng.")
          PYEOF
          python validate_esempi.py
      - name: Guardia co-occorrenza sugli esempi
        run: |
          set -e
          shopt -s nullglob
          n=0
          for f in tei/taxonomy/esempio/*.xml; do
            echo "::group::co-occorrenza $f"
            python3 .github/workflows/scripts/cooccurrence_guard.py "$f"
            echo "::endgroup::"
            n=$((n+1))
          done
          echo "Guardia co-occorrenza superata su $n esempio/i."

  e1-guard:
    name: Guardia E1 (classDecl header == tassonomia-gh.xml)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install lxml
        run: pip install lxml

      - name: Check required files exist
        run: |
          test -f tei/taxonomy/tassonomia-gh.xml || { echo "::error::tei/taxonomy/tassonomia-gh.xml non trovato"; exit 1; }
          test -f tei/header/castello-anima-teiHeader.xml || { echo "::error::tei/header/castello-anima-teiHeader.xml non trovato"; exit 1; }

      - name: Verifica non-divergenza delle 8 tassonomie interpretative (fonte <-> copia nell'header)
        run: |
          cat > e1_guard.py << 'PYEOF'
          import sys
          from lxml import etree

          NS = {"t": "http://www.tei-c.org/ns/1.0"}
          XMLID = "{http://www.w3.org/XML/1998/namespace}id"
          INTERP = {"func", "impact", "risk", "mystic_state",
                    "operation", "exposition", "phase", "relation"}
          SRC = "tei/taxonomy/tassonomia-gh.xml"
          HDR = "tei/header/castello-anima-teiHeader.xml"

          def cats(path):
              doc = etree.parse(path)
              d = {}
              for tax in doc.iterfind(".//t:taxonomy", NS):
                  if tax.get(XMLID) not in INTERP:
                      continue          # esclude fase/workflow: esistono solo nell'header
                  for c in tax.iterfind(".//t:category", NS):
                      cd = c.find("t:catDesc", NS)
                      txt = " ".join("".join(cd.itertext()).split()) if cd is not None else None
                      d[c.get(XMLID)] = txt
              return d

          src, hdr = cats(SRC), cats(HDR)
          errors = []
          for cid in sorted(set(src) | set(hdr)):
              if cid not in src:
                  errors.append(f"{cid}: presente nell'header ma NON nella fonte")
              elif cid not in hdr:
                  errors.append(f"{cid}: presente nella fonte ma NON nell'header")
              elif src[cid] != hdr[cid]:
                  errors.append(
                      f"{cid}: catDesc DIVERGENTE\n"
                      f"      fonte : {src[cid][:90]}\n"
                      f"      header: {hdr[cid][:90]}"
                  )

          if errors:
              print("::error::Divergenza E1 (fonte tassonomia-gh.xml <-> copia nell'header):")
              for e in errors:
                  print("  -", e)
              sys.exit(1)

          print(f"Guardia E1 superata: {len(src)} categorie interpretative identiche fra fonte e header.")
          PYEOF
          python e1_guard.py

