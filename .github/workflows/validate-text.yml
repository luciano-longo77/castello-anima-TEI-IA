name: Validate Text

on:
  push:
    branches: [main]
    paths:
      - "tei/text/**"
      - "tei/taxonomy/tassonomia-gh.xml"
      - "tei/header/**"
      - "schema/tei_all.rng"
      - "schema/impactindex.sch"
      - ".github/workflows/validate-text.yml"
      - ".github/workflows/scripts/**"
  pull_request:
    branches: [main]
    paths:
      - "tei/text/**"
      - "tei/taxonomy/tassonomia-gh.xml"
      - "tei/header/**"
      - "schema/impactindex.sch"
  workflow_dispatch:

env:
  TEXT: tei/text/castello-anima-teiText.xml
  TAX:  tei/taxonomy/tassonomia-gh.xml
  # Schema TEI P5 VENDORIZZATO nel repo (copia di oXygen): validazione riproducibile e
  # identica a quella locale. Per aggiornare la versione TEI, sostituire questo file.
  RNG:  schema/tei_all.rng
  # Schematron dell'indice d'impatto: R1 vocabolario bande, R2 ancore + formula, R3 classe<->I.
  SCH:  schema/impactindex.sch

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install lxml
      - name: Installa xmllint e jing
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils jing
      - name: File richiesti presenti
        run: |
          test -f "$TEXT" || { echo "::error::$TEXT non trovato"; exit 1; }
          test -f "$TAX"  || { echo "::error::$TAX non trovato"; exit 1; }
          test -s "$RNG"  || { echo "::error::$RNG non trovato o vuoto (vendorizza tei_all.rng)"; exit 1; }
          test -s "$SCH"  || { echo "::error::$SCH non trovato o vuoto"; exit 1; }
      - name: Guardia NFC (normalizzazione Unicode)
        run: |
          python3 - <<'PY'
          import unicodedata, sys, glob
          bad=[]
          for f in ["tei/text/castello-anima-teiText.xml","tei/header/castello-anima-teiHeader.xml","tei/taxonomy/tassonomia-gh.xml"]+glob.glob("tei/taxonomy/esempio/*.xml"):
              s=open(f,encoding="utf-8").read()
              if s!=unicodedata.normalize("NFC",s): bad.append(f)
          if bad:
              print("::error::File non in forma Unicode NFC:")
              for f in bad: print("  -",f)
              sys.exit(1)
          print("Guardia NFC superata: tutti i file XML sono normalizzati (NFC).")
          PY
      - name: Buona formazione + risoluzione XInclude
        run: xmllint --noout --xinclude "$TEXT"
      - name: Componi documento risolto (senza fixup xml:base)
        run: xmllint --nofixup-base-uris --xinclude "$TEXT" > resolved.xml
      - name: Validazione RelaxNG (TEI All, schema vendorizzato)
        run: jing "$RNG" resolved.xml
      - name: Guardia E2 (@ana -> tassonomia)
        run: python3 .github/workflows/scripts/e2_guard.py "$TEXT" "$TAX"
      - name: Guardia co-occorrenza (@ana)
        run: python3 .github/workflows/scripts/cooccurrence_guard.py "$TEXT"
      - name: Guardia cit/glossa (indice solo su <seg>)
        run: python3 .github/workflows/scripts/cit_glossa_guard.py "$TEXT"
      - name: Guardia citazioni (grammatica cit/quote/bibl)
        run: python3 .github/workflows/scripts/citazioni_guard.py "$TEXT"
      - name: Guardia commenti (grammatica dei commenti-seg)
        run: python3 .github/workflows/scripts/commenti_guard.py "$TEXT"
      - name: Guardia interventi editoriali (normalizzazione ↔ genetico)
        run: python3 .github/workflows/scripts/interventi_guard.py "$TEXT"
      - name: Guardia regole-fissate (retrace/naming/@ana-seg/sobrietà)
        run: python3 .github/workflows/scripts/regole_fissate_guard.py "$TEXT"
      - name: Guardia Schematron indice d'impatto (bande + ancore + formula)
        run: |
          python3 - <<'PY'
          import os, sys
          from lxml import etree, isoschematron
          doc = etree.parse(os.environ["TEXT"])
          sch = isoschematron.Schematron(etree.parse(os.environ["SCH"]), store_report=True)
          if not sch.validate(doc):
              svrl = {"svrl": "http://purl.oclc.org/dsdl/svrl"}
              print("::error::Schematron indice d'impatto: asserzioni fallite:")
              for f in sch.validation_report.xpath("//svrl:failed-assert", namespaces=svrl):
                  loc = f.get("location", "?")
                  txt = (f.findtext("svrl:text", namespaces=svrl) or "").strip()
                  print(f"  - [{loc}] {txt}")
              sys.exit(1)
          print("Guardia Schematron indice d'impatto superata (R1/R2/R3 su tutte le <fs>).")
          PY
