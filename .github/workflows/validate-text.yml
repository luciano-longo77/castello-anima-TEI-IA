name: Validate Text

on:
  push:
    branches: [main]
    paths:
      - "tei/text/**"
      - "tei/taxonomy/tassonomia-gh.xml"
      - "tei/header/**"
      - ".github/workflows/validate-text.yml"
      - ".github/workflows/scripts/**"
  pull_request:
    branches: [main]
    paths:
      - "tei/text/**"
      - "tei/taxonomy/tassonomia-gh.xml"
      - "tei/header/**"
  workflow_dispatch:

env:
  TEXT: tei/text/castello-anima-teiText.xml
  TAX:  tei/taxonomy/tassonomia-gh.xml
  # Versione TEI P5 FISSATA per riproducibilità (TEI Vault, non "release"=latest).
  # Aggiorna consapevolmente e allinea gli xml-model dei file se la cambi.
  TEI_VERSION: "4.9.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install lxml
      - name: Installa xmllint e jing
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils jing
      - name: File richiesti presenti
        run: |
          test -f "$TEXT" || { echo "::error::$TEXT non trovato"; exit 1; }
          test -f "$TAX"  || { echo "::error::$TAX non trovato"; exit 1; }
      - name: Scarica TEI All (RelaxNG) - versione fissata dal Vault
        run: |
          curl -sSL --retry 3 --fail -o tei_all.rng \
            "https://tei-c.org/Vault/P5/${TEI_VERSION}/xml/tei/custom/schema/relaxng/tei_all.rng"
          test -s tei_all.rng
          echo "TEI P5 schema pinnato alla versione ${TEI_VERSION}"
      - name: Guardia NFC (normalizzazione Unicode)
        run: |
          python3 - <<'PY'
          import unicodedata, sys, glob
          bad=[]
          for f in ["tei/text/castello-anima-teiText.xml","tei/header/castello-anima-teiHeader.xml","tei/taxonomy/tassonomia-gh.xml"]+glob.glob("tei/taxonomy/esempio/*.xml"):
              s=open(f,encoding="utf-8").read()
              if s!=unicodedata.normalize("NFC",s): bad.append(f)
          if bad:
              print("::error::File non in forma Unicode NFC:")
              for f in bad: print("  -",f)
              sys.exit(1)
          print("Guardia NFC superata: tutti i file XML sono normalizzati (NFC).")
          PY
      - name: Buona formazione + risoluzione XInclude
        run: xmllint --noout --xinclude "$TEXT"
      - name: Componi documento risolto (senza fixup xml:base)
        run: xmllint --nofixup-base-uris --xinclude "$TEXT" > resolved.xml
      - name: Validazione RelaxNG (TEI All)
        run: jing tei_all.rng resolved.xml
      - name: Guardia E2 (@ana -> tassonomia)
        run: python3 .github/workflows/scripts/e2_guard.py "$TEXT" "$TAX"
      - name: Guardia co-occorrenza (@ana)
        run: python3 .github/workflows/scripts/cooccurrence_guard.py "$TEXT"
